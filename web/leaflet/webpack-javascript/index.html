<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A minimal Parsimap raster map rendered with Leaflet 1.9.4 and webpack.">
    <title>Parsimap + Leaflet + JavaScript (webpack)</title>
    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #map {
        width: 100%;
        height: 500px;
      }

      .leaflet-control-attribution {
        direction: ltr;
        unicode-bidi: isolate;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Parsimap Leaflet map example</h1>
      <p id="map-error" role="alert" hidden></p>
      <div
        id="map"
        role="region"
        aria-label="Interactive map of Tehran"
        aria-describedby="map-error"
      ></div>
    </main>
  </body>
</html>
