name: Broken example
description: An example does not install, build, or show the map.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a real map token. Replace it with `YOUR_TOKEN_HERE`. To report a security problem, follow SECURITY.md instead of opening an issue.
  - type: input
    id: folder
    attributes:
      label: Example folder
      placeholder: web/maplibre-gl-js/react-vite
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web browser
        - Android
        - iOS
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser or device, and the versions of the tools you used (Node.js, Android Studio, Xcode, Flutter, and so on).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, starting from the example folder.
      placeholder: |
        1. npm ci
        2. npm run dev
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the full error output or the message shown in place of the map.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
