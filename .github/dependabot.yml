version: 2
updates:
  # One pull request per example folder. Major versions are ignored because
  # several examples target a specific major, such as Next.js 15 or SvelteKit 2,
  # and a major upgrade also needs its documentation guide updated.
  - package-ecosystem: npm
    directories:
      - /web/*/*
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Android examples, one pull request per folder. Ignoring majors also skips
  # MapLibre Native's calendar-versioned *-globe pre-releases (2026.x).
  - package-ecosystem: gradle
    directories:
      - /android/*/*
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Cross-platform examples, one pull request per folder and package manager.
  - package-ecosystem: pub
    directories:
      - /cross-platform/flutter/*
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
