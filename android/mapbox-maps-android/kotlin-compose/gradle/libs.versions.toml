[versions]
agp = "9.5.0"
androidxActivity = "1.13.0"
composeBom = "2026.09.00"
# The Kotlin version that AGP 9.5 compiles with; the Compose compiler plugin must match it.
kotlin = "2.2.10"
mapbox = "11.34.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
mapbox-maps = { module = "com.mapbox.maps:android-ndk27", version.ref = "mapbox" }
mapbox-maps-compose = { module = "com.mapbox.extension:maps-compose-ndk27", version.ref = "mapbox" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
